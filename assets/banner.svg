<svg width="960" height="240" viewBox="0 0 960 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#080d1a" />
    </linearGradient>

    <!-- Glowing Radial Spots -->
    <radialGradient id="glowCyan" cx="90%" cy="10%" r="65%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.32" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="10%" cy="90%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#050811" stop-opacity="0" />
    </radialGradient>

    <!-- Title Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#e0f2fe" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="30%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.7" />
    </linearGradient>

    <!-- Sci-Fi Grid -->
    <pattern id="sciGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.6" />
      <circle cx="0" cy="0" r="1.3" fill="#38bdf8" fill-opacity="0.45" />
    </pattern>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 0.95; }
    }
    @keyframes blink {
      0%, 49% { opacity: 1; }
      50%, 100% { opacity: 0; }
    }
    .pulsing-dot { animation: pulseGlow 2.5s infinite ease-in-out; }
    .blinking-cursor { animation: blink 1.1s infinite steps(1); }
  </style>

  <!-- Base Card -->
  <rect x="2" y="2" width="956" height="236" rx="16" fill="url(#bgGrad)" />
  <rect x="2" y="2" width="956" height="236" rx="16" fill="url(#sciGrid)" />
  <rect x="2" y="2" width="956" height="236" rx="16" fill="url(#glowCyan)" />
  <rect x="2" y="2" width="956" height="236" rx="16" fill="url(#glowPurple)" />
  <rect x="2" y="2" width="956" height="236" rx="16" stroke="url(#borderGrad)" stroke-width="1.8" fill="none" />

  <!-- Corner Tech Accents -->
  <g opacity="0.75">
    <path d="M 18 36 L 18 18 L 36 18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 942 36 L 942 18 L 924 18" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 18 204 L 18 222 L 36 222" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <path d="M 942 204 L 942 222 L 924 222" stroke="#6366f1" stroke-width="2.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Right Decorative Telemetry Node Grid -->
  <g opacity="0.45" transform="translate(680, 24)">
    <line x1="0" y1="20" x2="220" y2="20" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />
    <line x1="220" y1="20" x2="240" y2="40" stroke="#38bdf8" stroke-width="1" />
    <line x1="240" y1="40" x2="240" y2="160" stroke="#38bdf8" stroke-width="1" />
    <line x1="240" y1="160" x2="220" y2="180" stroke="#6366f1" stroke-width="1" />
    <line x1="220" y1="180" x2="60" y2="180" stroke="#6366f1" stroke-width="1" stroke-dasharray="4,4" />

    <circle cx="0" cy="20" r="3" fill="#38bdf8" class="pulsing-dot" />
    <circle cx="240" cy="100" r="3" fill="#22d3ee" class="pulsing-dot" />
    <circle cx="60" cy="180" r="3" fill="#6366f1" class="pulsing-dot" />
    <text x="140" y="16" fill="#38bdf8" class="mono" font-size="9" letter-spacing="1">STATUS: 200 OK</text>
  </g>

  <!-- Terminal Breadcrumb Tag -->
  <g transform="translate(48, 42)">
    <circle cx="5" cy="5" r="4" fill="#22d3ee" class="pulsing-dot" />
    <text x="18" y="9" fill="#38bdf8" class="mono" font-size="11.5" font-weight="700" letter-spacing="1.8">
      RADIXSORT.DE <tspan fill="#64748b">//</tspan> SOLUTION ARCHITECTURE &amp; FULLSTACK SYSTEMS
    </text>
  </g>

  <!-- Main Headline -->
  <text x="48" y="108" fill="url(#titleGrad)" class="sans" font-size="46" font-weight="900" letter-spacing="-0.5">
    THORE SOLTAU<tspan class="blinking-cursor" fill="#22d3ee">_</tspan>
  </text>

  <!-- Subtitle -->
  <text x="48" y="145" fill="#94a3b8" class="sans" font-size="16.5" font-weight="500">
    Senior Fullstack Developer &amp; Solution Architect <tspan fill="#38bdf8" opacity="0.8">|</tspan> Cloud-Native Enterprise Engineering
  </text>

  <!-- Visual Skill Pills / Focus Badges -->
  <g transform="translate(48, 172)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="168" height="28" rx="6" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#22d3ee" />
      <text x="26" y="18" fill="#f8fafc" class="mono" font-size="11" font-weight="600">Domain-Driven Design</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(180, 0)">
      <rect width="156" height="28" rx="6" fill="#0f172a" stroke="#6366f1" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#818cf8" />
      <text x="26" y="18" fill="#f8fafc" class="mono" font-size="11" font-weight="600">MACH Architecture</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(348, 0)">
      <rect width="176" height="28" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#38bdf8" />
      <text x="26" y="18" fill="#f8fafc" class="mono" font-size="11" font-weight="600">Event-Driven / CQRS</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(536, 0)">
      <rect width="210" height="28" rx="6" fill="#0f172a" stroke="#3b82f6" stroke-width="1.2" />
      <circle cx="14" cy="14" r="3.5" fill="#60a5fa" />
      <text x="26" y="18" fill="#f8fafc" class="mono" font-size="10.5" font-weight="600">Cloud-Native (GCP/AWS/Azure)</text>
    </g>
  </g>
</svg>
